<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar naves espaciales</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Buscador de naves espaciales</h1>
        <p>Consulta información de las naves de Star Wars.</p>
        <a href="index.html">Volver al inicio</a>
    </header>

    <main>
        <section>
            <form data-form="starship">
                <label for="starship-id">ID de la nave:</label>
                <input name="id" type="number" id="starship-id" min="1"
                       placeholder="Ejemplo: 9" required>
                <button type="submit">Buscar nave</button>
            </form>

            <div id="starship-result" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
